name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y liblcms2-2
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: profiles/icc
          key: icc-${{ hashFiles('profiles/profiles.json') }}
      - run: python scripts/fetch_profiles.py
      - run: pytest -q
